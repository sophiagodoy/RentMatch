services:
  db:
    image: postgres:16
    container_name: meu-projeto-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: rentmatch
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usuario -d meubanco"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: